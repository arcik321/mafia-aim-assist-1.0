[aim]
; Press the left trigger or this keyboard key to lock onto the nearest person in front of you.
; After losing a target, release and press again to acquire another.
; Supports one letter/digit, F1-F12, SPACE, ENTER, TAB, ESC, SHIFT, CTRL, ALT, CAPSLOCK, BACKSPACE.
aim_key = O

; Toggle crouch on each press of Xbox B while on foot (1 = on, 0 = off).
crouch_toggle = 1

; Driver-only targets: wheels, police and mafiosi share one pool; the target nearest the crosshair is locked.
; While locked, flick the right stick left/right/up/down to move to the next target in that direction.
vehicle_aim = 1

; Arcade redirects actual player-car shots to a locked target on any side.
; It bypasses firing-side and cover limits; 0 restores geometric mouse assistance.
vehicle_arcade = 1

; Lethal damage when a player-car shot actually hits a living police officer; NPC/on-foot shots are unchanged.
vehicle_one_shot = 1

; Keeps the chase camera behind the car and lets the right stick/mouse rotate it while driving (0 = native camera).
vehicle_free_camera = 1

; Height of the aim point above the target's feet, in centimetres.
; Flick the right stick up while locked to raise the aim point toward the head.
; Flick down for lower torso; repeat a flick to return to this base height.
aim_height_cm = 95

; Fallback only when the target has no usable skeleton: lower the head point if its +0x1e4 byte is nonzero.
experimental_crouch_head_aim = 1

; Use the animated head/neck hit capsule while head aim is selected (1 = on, 0 = off).
animated_head_aim = 1

; Horizontal offset toward the face along its animated forward direction (centimetres, range 0..25).
animated_head_forward_cm = 8

; Lower this to make lock-on approach the target more slowly (range 25..150).
aim_response_percent = 70

; Drop targets when level geometry blocks the line from the camera (1 = on, 0 = off).
require_line_of_sight = 1

; Prefer mission enemies (AI group 4) when acquiring or manually switching; a locked target is not automatically replaced.
prioritize_enemies = 1

; Acquisition cones in degrees (ordinary NPCs 5..45, mission enemies 5..60).
target_cone_degrees = 20
enemy_target_cone_degrees = 35

; While locked on, make a horizontal-dominant flick to switch to the nearest person on that side.
; Vertical-dominant flicks are reserved for aim zones; switches have a short debounce.
; 2 = right stick (default; it stops looking around while a target is locked), 1 = left stick, 0 = off.
target_switch_stick = 2

; While locked on, flick the right stick up for head height or down for lower torso; repeat to return to torso.

; Right stick moves the camera like a mouse (1 = on, 0 = off).
right_stick_look = 1

; Camera speed at full stick deflection (mouse counts per second). Raise to turn faster.
look_x_speed = 1100
look_y_speed = 1000

; Set to 1 if looking up/down feels inverted.
invert_y = 0

; Ignore small stick drift (percent of stick travel).
stick_deadzone = 15

[sandbox]
; Experimental NPC sandbox is disabled; host changes require a restart.
enabled = 0

; Optional test cheats (0 / 100 = off).
[cheats]
player_health = 0
car_acceleration_percent = 100
